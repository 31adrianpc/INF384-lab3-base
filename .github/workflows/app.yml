name: app

# Pipeline de aplicacion. Es dueno de la imagen que ejecuta la funcion y no
# toca la infraestructura.
#
# De las cuatro gates, solo `secretos` detiene el pipeline. Las otras
# tres informan y dejan pasar: el hallazgo tiene que quedar visible en la
# ejecucion, no enterrado en el log.
#
# El repositorio no tiene archivo de excepciones. Un hallazgo que se decida
# no corregir se anota donde se produce: junto a la linea de codigo que lo
# origina, o en el paso del pipeline que lo detecta cuando el hallazgo no
# corresponde a ninguna linea. La anotacion lleva identificador del hallazgo,
# razon, responsable y fecha de vencimiento. Las cuatro, siempre.
#
# En los jobs sin implementar, preferir una action del marketplace o la
# imagen oficial de la herramienta antes que instalarla paso a paso en el
# runner. La guia del laboratorio lista las referencias disponibles.

on:
  push:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar desde el lock file
        run: npm ci

      - name: Pruebas con reporte de cobertura
        run: npm run test:coverage

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: error

  # Calidad: analisis y cobertura en SonarQube Cloud, como en el Laboratorio 2.
  # Consume el reporte de cobertura de pruebas y necesita el historial
  # completo para distinguir el codigo nuevo.
  # No detiene: el resultado de la quality gate se publica en el resumen.
  calidad:
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar el reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage

      - name: Analisis en SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      # Informativa: espera a que SonarQube Cloud procese el analisis y lee
      # el estado de la quality gate. Nunca detiene el job: el resultado se
      # publica en el resumen y, si no es OK, como advertencia.
      - name: Publicar el resultado de la quality gate
        env:
          PROYECTO: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -u
          reporte=.scannerwork/report-task.txt
          url_tarea="$(sed -n 's/^ceTaskUrl=//p' "$reporte")"
          url_panel="$(sed -n 's/^dashboardUrl=//p' "$reporte")"
          auth="Authorization: Bearer ${SONAR_TOKEN}"

          estado=""
          analisis=""
          for _ in $(seq 1 30); do
            tarea="$(curl -s -H "$auth" "$url_tarea")"
            estado_tarea="$(printf '%s' "$tarea" | jq -r '.task.status // empty' 2>/dev/null)"
            case "$estado_tarea" in
              SUCCESS) analisis="$(printf '%s' "$tarea" | jq -r '.task.analysisId')"; break ;;
              FAILED|CANCELED) break ;;
            esac
            sleep 5
          done

          echo "Tarea de analisis: ${estado_tarea:-sin respuesta}"
          if [ -n "$analisis" ]; then
            respuesta="$(curl -s -w '\n%{http_code}' -H "$auth" \
                           "${SONAR_HOST_URL}/api/qualitygates/project_status?analysisId=${analisis}")"
            echo "project_status: HTTP $(printf '%s' "$respuesta" | tail -n1)"
            estado="$(printf '%s' "$respuesta" | sed '$d' | jq -r '.projectStatus.status // empty' 2>/dev/null)"
          else
            printf '%s\n' "$tarea" | head -c 300; echo
          fi

          if [ "$estado" != "OK" ]; then
            echo "::warning title=calidad::Quality gate de SonarQube Cloud: ${estado:-sin resultado}. Detalle en ${url_panel}"
          fi
          {
            echo '## Calidad (SonarQube Cloud)'
            echo
            echo "Quality gate: **${estado:-sin resultado}** (informativo, no detiene)"
            echo
            echo "Detalle: ${url_panel}"
            if [ -z "$estado" ]; then
              echo
              echo "No se pudo leer el estado. Si la API responde 403, el token no tiene permiso de lectura sobre el proyecto: usar un token personal (My Account > Security)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Secretos: credenciales escritas en el codigo y en TODO el historial.
  # Es la unica compuerta de este pipeline que detiene: cualquier hallazgo.
  #
  # Se usa la imagen oficial de gitleaks y no gitleaks-action, porque la
  # action en un push solo revisa los commits de ese push. Con fetch-depth: 0
  # y el comando `git`, gitleaks recorre todos los commits: una credencial
  # borrada en un commit posterior sigue apareciendo.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar credenciales en el codigo y en el historial
        run: |
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${PWD}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
              --redact \
              --no-banner \
              --report-format json \
              --report-path /repo/gitleaks.json \
              --exit-code 1
          estado=$?
          set -e

          hallazgos="$(jq 'length' gitleaks.json 2>/dev/null || echo 0)"

          {
            echo '## Secretos (gitleaks, historial completo)'
            echo
            if [ "$hallazgos" -gt 0 ]; then
              echo "**${hallazgos} hallazgo(s). El pipeline se detiene.**"
              echo
              echo '| Regla | Archivo | Linea | Commit | Autor |'
              echo '|---|---|---|---|---|'
              jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | `\(.Commit[0:7])` | \(.Author) |"' gitleaks.json
              echo
              echo 'La credencial no se exceptua: se retira del codigo, se retira del historial y se rota en el origen.'
            else
              echo 'Sin hallazgos.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$hallazgos" -gt 0 ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=secretos::\(.RuleID) en el commit \(.Commit[0:7])"' gitleaks.json
          fi
          exit "$estado"

  # Dependencias: el arbol completo del lock file, incluidas las de
  # desarrollo, contra vulnerabilidades conocidas.
  # No detiene (exit-code 0): los hallazgos se publican en el resumen.
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trivy excluye las devDependencies por defecto. Sin
      # TRIVY_INCLUDE_DEV_DEPS el informe trae un solo hallazgo.
      - name: Analizar el arbol de dependencias
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          format: json
          output: trivy-dependencias.json
          exit-code: '0'

      - name: Publicar los hallazgos
        run: |
          total="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-dependencias.json)"
          {
            echo '## Dependencias (trivy, arbol completo de package-lock.json)'
            echo
            if [ "$total" -gt 0 ]; then
              echo "**${total} vulnerabilidad(es) conocida(s).** Informativo, no detiene."
              echo
              echo '| Severidad | Paquete | Version | Vulnerabilidad | Corregida en |'
              echo '|---|---|---|---|---|'
              jq -r '.Results[]?.Vulnerabilities[]? | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.VulnerabilityID) | \(.FixedVersion // "-") |"' trivy-dependencias.json
            else
              echo 'Sin vulnerabilidades conocidas.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.Results[]?.Vulnerabilities[]? | "::warning file=package-lock.json,title=dependencias::\(.Severity) \(.PkgName)@\(.InstalledVersion) \(.VulnerabilityID) (corregida en \(.FixedVersion // "-"))"' trivy-dependencias.json

  # Estatico: patrones explotables en el codigo fuente (semgrep).
  # No detiene: cada hallazgo queda anotado sobre su linea y en el resumen.
  estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin --error, semgrep termina en 0 aunque haya hallazgos. Si falla
      # la herramienta (no los hallazgos), el paso falla.
      - name: Analizar el codigo fuente
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            semgrep/semgrep \
            semgrep scan \
              --config=p/default \
              --config=p/javascript \
              --json --quiet \
              --output=semgrep.json \
              src/

      - name: Publicar los hallazgos
        run: |
          total="$(jq '.results | length' semgrep.json)"
          archivos="$(jq '.paths.scanned | length' semgrep.json)"
          errores="$(jq '.errors | length' semgrep.json)"
          echo "semgrep: ${total} hallazgo(s), ${archivos} archivo(s) analizados, ${errores} error(es)"
          jq -r '.errors[]? | .message' semgrep.json | head -5
          {
            echo '## Analisis estatico (semgrep)'
            echo
            echo "Archivos analizados: ${archivos}. Errores de la herramienta: ${errores}."
            echo
            if [ "$total" -gt 0 ]; then
              echo "**${total} hallazgo(s).** Informativo, no detiene."
              echo
              echo '| Severidad | Regla | Archivo | Linea |'
              echo '|---|---|---|---|'
              jq -r '.results[] | "| \(.extra.severity) | \(.check_id) | `\(.path)` | \(.start.line) |"' semgrep.json
            else
              echo 'Sin hallazgos.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | "::warning file=\(.path),line=\(.start.line),title=estatico::\(.check_id): \(.extra.message | gsub("\n"; " "))"' semgrep.json

  # Construye la imagen y la publica en el registro privado.
  # Depende de las cuatro compuertas y corre solo desde la rama principal.
  #
  # Dos tags sobre el mismo manifiesto:
  #   - sha corto del commit: inmutable, es con el que se publica y del que
  #     se lee el digest.
  #   - prd: movil, se reasigna al manifiesto ya publicado sin reenviar capas.
  #
  # La salida digest tiene el formato <registro>/<aplicacion>@sha256:...,
  # que es lo que consume el job desplegar.
  publicar:
    needs: [calidad, secretos, dependencias, estatico]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publicacion.outputs.digest }}
    env:
      APLICACION: inf384-lab3
      AMBIENTE: prd
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Entrar al registro
        id: registro
        uses: aws-actions/amazon-ecr-login@v2

      # --provenance/--sbom=false: sin ellos buildx puede publicar un indice
      # con atestaciones en vez de un manifiesto simple, y Lambda lo rechaza.
      - name: Construir y publicar con el tag del commit
        id: publicacion
        env:
          REGISTRO: ${{ steps.registro.outputs.registry }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:7}"
          imagen="${REGISTRO}/${APLICACION}"

          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.title=${APLICACION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${imagen}:${sha}" \
            .
          docker push "${imagen}:${sha}"

          # El digest se lee del registro, a partir del tag del commit.
          digest="$(aws ecr describe-images \
                      --repository-name "$APLICACION" \
                      --image-ids "imageTag=${sha}" \
                      --query 'imageDetails[0].imageDigest' \
                      --output text)"

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "digest=${imagen}@${digest}" >> "$GITHUB_OUTPUT"

      # El tag de ambiente se agrega sobre el manifiesto ya publicado: se
      # copia el manifiesto con otro tag. No se reconstruye ni se reenvia nada.
      - name: Apuntar el tag de ambiente al mismo manifiesto
        env:
          DIGEST: ${{ steps.publicacion.outputs.digest }}
        run: |
          set -euo pipefail
          sha256="${DIGEST##*@}"
          manifiesto="$(aws ecr batch-get-image \
                          --repository-name "$APLICACION" \
                          --image-ids "imageDigest=${sha256}" \
                          --query 'images[0].imageManifest' \
                          --output text)"
          tipo="$(aws ecr batch-get-image \
                    --repository-name "$APLICACION" \
                    --image-ids "imageDigest=${sha256}" \
                    --query 'images[0].imageManifestMediaType' \
                    --output text)"

          # Si prd ya apunta a este mismo manifiesto, ECR responde
          # ImageAlreadyExistsException: no hay nada que mover.
          if ! salida="$(aws ecr put-image \
                           --repository-name "$APLICACION" \
                           --image-tag "$AMBIENTE" \
                           --image-manifest "$manifiesto" \
                           --image-manifest-media-type "$tipo" 2>&1)"; then
            if printf '%s' "$salida" | grep -q ImageAlreadyExistsException; then
              echo "${AMBIENTE} ya apuntaba a ${sha256}."
            else
              printf '%s\n' "$salida" >&2
              exit 1
            fi
          fi

      - name: Resumen de la publicacion
        env:
          DIGEST: ${{ steps.publicacion.outputs.digest }}
          SHA: ${{ steps.publicacion.outputs.sha }}
        run: |
          {
            echo '## Imagen publicada'
            echo
            echo '| Tag | Naturaleza |'
            echo '|---|---|'
            echo "| \`${SHA}\` | inmutable, del commit |"
            echo "| \`${AMBIENTE}\` | movil, ambiente |"
            echo
            echo "Digest (salida del job): \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Este job viene completo y no se modifica.
  # Las estrategias de despliegue y la verificacion posterior son contenido
  # de la sesion 6. La pregunta de reflexion 2 pide leerlo.
  desplegar:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Actualizar la funcion por digest
        run: |
          aws lambda update-function-code \
            --function-name inf384-lab3 \
            --image-uri ${{ needs.publicar.outputs.digest }}

      - name: Esperar a que la actualizacion termine
        run: aws lambda wait function-updated --function-name inf384-lab3
