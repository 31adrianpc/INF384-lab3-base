# La organization key y la project key se pasan desde el pipeline, como
# variables de repositorio:
#   sonar.organization -> SONAR_ORG
#   sonar.projectKey   -> SONAR_PROJECT_KEY
# Ver .github/workflows/app.yml, job "calidad".
#
# Este archivo viene resuelto. No hay que editarlo.

sonar.sources=src
sonar.tests=test
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=dist/**,coverage/**,node_modules/**
